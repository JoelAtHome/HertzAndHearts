name: build

on:
  workflow_dispatch:
    inputs:
      upload_to_release_tag:
        description: "Optional. Published release tag to upload desktop artifacts to (e.g. v1.0.0-beta.2). Leave empty for build-only artifacts."
        required: false
        type: string
        default: ""
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35) keeps the AppImage runnable on Debian 12
          # and other light desktops; 24.04 would raise the glibc floor.
          - os: ubuntu-22.04
            artifact_name: Hertz-and-Hearts-linux-x64
            artifact_path: dist/Hertz-and-Hearts
          - os: windows-2022
            artifact_name: Hertz-and-Hearts-windows-x64
            artifact_path: dist/Hertz-and-Hearts
          - os: macos-14
            artifact_name: Hertz-and-Hearts-macos
            artifact_path: dist/Hertz-and-Hearts.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build]

      - name: Compute release version label
        id: version
        shell: bash
        run: |
          V="$(python - <<'PY'
          import re, tomllib
          v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          m = re.fullmatch(r"(\d+\.\d+\.\d+)b(\d+)", v)
          if m:
              n = int(m.group(2))
              print(f"{m.group(1)}-beta" if n == 0 else f"{m.group(1)}-beta.{n}")
          else:
              print(v)
          PY
          )"
          echo "label=$V" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          MANUAL_TAG: ${{ github.event.inputs.upload_to_release_tag }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            T="${{ github.ref_name }}"
          else
            T=$(printf '%s' "$MANUAL_TAG" | tr -d '\r' | xargs)
          fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"

      - name: Build app bundle (all platforms)
        run: |
          pyinstaller Hertz-and-Hearts.spec --clean --noconfirm

      - name: Install Linux AppImage dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libfuse2: run nested AppImages if extract-and-run is unavailable
          sudo apt-get install -y libfuse2

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        run: |
          PACKAGE_NAME="Hertz-and-Hearts-${{ steps.version.outputs.label }}-linux-x64.tar.gz"
          tar -C dist -czf "dist/${PACKAGE_NAME}" Hertz-and-Hearts
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"

      - name: Create Linux AppImage
        if: runner.os == 'Linux'
        env:
          # CI runners lack usable FUSE for nested AppImages (appimagetool).
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          # Use appimagetool directly (not linuxdeploy): PyInstaller already
          # bundles libs beside the binary; linuxdeploy rewrites rpaths and
          # rejects non-standard icon sizes.
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/applications

          cp -r dist/Hertz-and-Hearts/* AppDir/usr/bin/

          cp docs/hertz-and-hearts-256.png AppDir/usr/share/icons/hicolor/256x256/apps/hertz-and-hearts.png
          cp docs/hertz-and-hearts-256.png AppDir/hertz-and-hearts.png

          cat > AppDir/usr/share/applications/hertz-and-hearts.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=Hertz & Hearts
          Exec=Hertz-and-Hearts
          Icon=hertz-and-hearts
          Type=Application
          Categories=Science;Education;
          Comment=Hertz & Hearts - HRV biofeedback and session reporting
          DESKTOP
          cp AppDir/usr/share/applications/hertz-and-hearts.desktop AppDir/hertz-and-hearts.desktop

          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/Hertz-and-Hearts" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir Hertz-and-Hearts-Linux.AppImage
          test -f Hertz-and-Hearts-Linux.AppImage
          ls -lh Hertz-and-Hearts-Linux.AppImage

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: |
          PACKAGE_NAME="Hertz-and-Hearts-${{ steps.version.outputs.label }}-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/Hertz-and-Hearts.app "dist/${PACKAGE_NAME}"
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageName = "Hertz-and-Hearts-${{ steps.version.outputs.label }}-windows-x64.zip"
          Compress-Archive -Path "dist/Hertz-and-Hearts/*" -DestinationPath "dist/$packageName" -Force
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_NAME=$packageName"

      - name: Build Windows installer (.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = python -c 'import re, tomllib; v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; m = re.fullmatch(r"(\d+\.\d+\.\d+)b(\d+)", v); print(f"{m.group(1)}-beta" if m and m.group(2) == "0" else f"{m.group(1)}-beta.{m.group(2)}" if m else v)'
          iscc "/DMyAppVersion=$ver" installer.iss

      # Upload the built tree, not a pre-made .zip/.tar.gz: GitHub always zips
      # artifacts, so uploading e.g. *.zip yields a zip inside the download zip.
      - name: Upload platform artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-${{ steps.version.outputs.label }}
          path: ${{ matrix.artifact_path }}

      - name: Upload Windows setup artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: Hertz-and-Hearts-Windows-Setup-${{ steps.version.outputs.label }}
          path: installer_output/*.exe

      - name: Upload Linux AppImage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: Hertz-and-Hearts-Linux
          path: Hertz-and-Hearts-Linux.AppImage

      - name: Upload artifacts to GitHub release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_release_tag != '')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ steps.release_tag.outputs.tag }}" "dist/${PACKAGE_NAME}" --clobber
          if [ "${{ runner.os }}" = "Windows" ]; then
            gh release upload "${{ steps.release_tag.outputs.tag }}" installer_output/*.exe --clobber
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            gh release upload "${{ steps.release_tag.outputs.tag }}" Hertz-and-Hearts-Linux.AppImage --clobber
          fi
